name: Refresh Instagram token

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday; tokens last 60 days
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pynacl
      - run: python -m autopilot.main refresh-token
